name: yatrago

services:
  postgres:
    # postgis/postgis, not plain postgres: PostGIS is a hard dependency, and a
    # developer who starts the stack without it gets confusing failures deep
    # inside the geofence query instead of a clear one at boot.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: yatrago
      POSTGRES_PASSWORD: yatrago
      POSTGRES_DB: yatrago
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yatrago -d yatrago']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for S3 locally so signed uploads are exercised for real rather
  # than mocked — the upload path is where the check-in flow usually breaks.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/yatrago-media-dev;
      mc anonymous set download local/yatrago-media-dev;
      echo 'Bucket ready.';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
